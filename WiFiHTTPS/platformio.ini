[env:esp32dev]
platform = espressif32@5.3.0
framework = arduino
board = esp32dev
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
debug_speed = 115200
lib_ldf_mode = deep+

lib_deps =
    U8g2
    EEPROM
    BluetoothSerial
    bblanchon/ArduinoJson@^7
    SPIFFS
    FS
    Wire
    milesburton/DallasTemperature@^3.9.1
    https://github.com/PaulStoffregen/OneWire.git
    adafruit/Adafruit Unified Sensor
    adafruit/DHT sensor library
    SPI
    Ticker
    WiFi
    WebServer
    HTTPClient
    Update
    PubSubClient
    WiFiClientSecure
    StringSplitter
    https://github.com/softwarelogistics/nuviot.git#master
